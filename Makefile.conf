! Makefile.conf
!    Makefile template for ScidCommunity for Unix operating systems.
!
! This file is NOT an actual Makefile; it is a template file used by 
! the configure program to produce the actual Makefile for ScidCommunity with
! approriate settings for your system. Just type "./configure" in the 
! current directory to run the configuration program.
!
! All lines starting with "!" (such as these) are removed, and certain
! variables enclosed in "@" symbols (such as @TCL_VERSION@) are set.
!
##### Makefile for ScidCommunity for Unix operating systems.

### Compiler: Most Unix systems use g++ for compiling and linking.
#
COMPILE = @COMPILE@
LINK = @LINK@
LIBS = @LIBS@
INSTALL = @INSTALL@

# BINDIR: where the Scid programs are copied for "make install".
#
BINDIR = @BINDIR@

# SHAREDIR: where scidCommunity data files are copied for "make install".
#
SHAREDIR = @SHAREDIR@

### TCL_VERSION: Set this according to the version of Tcl/Tk you have
#   installed that you want Scid to use: 8.0, 8.1, 8.2, 8.3, etc.
#
TCL_VERSION = @TCL_VERSION@

# TCL_INCLUDE, TCL_LIBRARY: these are the compiler options
#    needed for linking Scid with Tcl/Tk.  The program "./configure"
#    will try to determine them automatically, but if it cannot, you
#    can use the examples below for help in setting these variables.
#
# @CONFIG_RESULT@
#
TCL_INCLUDE = @TCL_INCLUDE@
TCL_LIBRARY = @TCL_LIBRARY@


########################################
### Compiler options:

### SCIDFLAGS: Scid customization flags.
#
SCID_VERSION = @SCID_VERSION@
SCID_DATE = @SCID_DATE@
SCIDFLAGS = @SCIDFLAGS@ -DSCID_VERSION_STRING="\"$(SCID_VERSION)\"" -DSCID_BUILD_DATE="\"$(SCID_DATE)\""

### OPTIMIZE: Optimization options for C++ compiler.
#      -O3 is the most optimization for g++. I have found -O2 to do
#      just as well, but someone reported a noticeable difference in speed
#      between -O3 and -O2 so the default here is -O3.
#      On some systems, adding "-fno-rtti" and "-fno-exceptions" produces
#      smaller, faster programs since Scid does not use those C++ features.
#
OPTIMIZE = @OPTIMIZE@ @THREADS@

### DEBUG: Debug flags. Use "-g" to include debugging information and
#       "-DNDEBUG" to disable debugging information and assertions.
#
DEBUG = @DEBUG@

### WARNINGS: I always compile with all warnings on (-Wall), and all the
#       files should compile warning-free using g++.
#
WARNINGS = @WARNINGS@

### PROFILE: Set this to "-pg" for profiling in g++ and gcc.
#
PROFILE = @PROFILE@

### CPP_FLAGS: Flags for C++ compilation.
#
CPP_FLAGS = $(CXXFLAGS) $(CPPFLAGS) $(PROFILE) $(OPTIMIZE) $(WARNINGS) $(DEBUG) $(SCIDFLAGS) $(TB)

############################################################
#
# You should not need to edit anything below this line.
#
############################################################

### EXECS: executable programs compiled from C++ files.
#
EXECS= scidCommunity

### SCIDOBJS:
SCIDCPP= $(wildcard src/*.cpp)
SCIDOBJS= $(SCIDCPP:.cpp=.o)

# CQL (Chess Query Language) engine, imported from Scid vs. PC. Every .cpp in
# the directory is part of the application build (upstream's standalone driver
# and Game/MFile patch files were not imported; see src/cql/README.md).
CQLCPP= $(wildcard src/cql/*.cpp)
CQLOBJS= $(CQLCPP:.cpp=.o)

POLYGLOT= $(wildcard src/polyglot/*.cpp)
XOBJS= $(POLYGLOT:.cpp=.o)

DEPENDS = ${SCIDOBJS:.o=.d} ${CQLOBJS:.o=.d} ${XOBJS:.o=.d}

### OBJS: Will be "$(SCIDOBJS)", "$(POLYGLOTOBJS)"
OBJS= @OBJS@ $(CQLOBJS)

ifeq ($(shell uname),Darwin)
DNDOBJS =
DNDLIBS =
else
DNDOBJS = src/tkdnd/unix/TkDND_XDND.o
DNDLIBS = -lX11
endif

### SCRIPTS:
# Small extra programs. Most are written in Tcl using tkscid, but
# a few contributed ones may be in Python or other languages.
#
SCRIPTS= sc_epgn.tcl sc_spell.tcl sc_eco.tcl sc_import.tcl sc_remote.tk scidpgn.tcl spliteco.tcl spf2spi.tcl

####################

### Type "make" or "make all" to make all programs:
#
all: scidCommunity all_engines
all_engines: phalanx-scid

scidCommunity: $(OBJS) $(XOBJS) $(DNDOBJS)
	$(LINK) $(CPP_FLAGS) $(XOBJS) $(OBJS) $(DNDOBJS) $(TCL_LIBRARY) $(LIBS) $(DNDLIBS) -o $(EXECS)

phalanx-scid:
	cd engines/phalanx-scid/ && $(MAKE) && cd ../../

### To copy all executables to $BINDIR, with read and execute permission 
#   for all users, and put extra files in $SHAREDIR, type "make install".
#

install: $(INSTALL)

install_shared: scidCommunity
	install -m 755 -d "$(SHAREDIR)"
	cp scidCommunity "$(SHAREDIR)"
	cp *.eco "$(SHAREDIR)"
	cp -r bitmaps "$(SHAREDIR)"
	cp -r books "$(SHAREDIR)"
	cp -r html "$(SHAREDIR)"
	cp -r img "$(SHAREDIR)"
	cp -r scripts "$(SHAREDIR)"
	cp -r sounds "$(SHAREDIR)"
	cp -r tcl "$(SHAREDIR)"

install_scid: install_shared
	install -m 755 -d "$(BINDIR)"
	ln -sf "$(SHAREDIR)/scidCommunity" "$(BINDIR)/scidCommunity"
	@for script in $(SCRIPTS); do \
		cp "scripts/$$script" "$(BINDIR)"; \
		chmod +x "$(BINDIR)/$$script"; \
	done

install_engines: all_engines
	install -m 755 -d "$(SHAREDIR)/engines"
	install -m 755 -d "$(SHAREDIR)/engines/phalanx-scid"
	install ./engines/phalanx-scid/phalanx-scid "$(SHAREDIR)/engines/phalanx-scid"

uninstall:
	cd $(BINDIR) && rm -f $(EXECS) $(SCRIPTS)
	rm -rf $(SHAREDIR)

### To remove object and executable files: type "make clean".
#
clean:
	rm -f scidlet scidlet.d src/*.o src/cql/*.o src/polyglot/*.o src/tkdnd/unix/*.o $(EXECS) scidCommunity $(SCRIPTS)
	rm -f src/*.d src/cql/*.d src/polyglot/*.d src/tkdnd/unix/*.d
	cd engines/phalanx-scid/ && make clean && cd ../../
	rm -Rf dist

### To remove everything built by configure and make: type "make distclean".
#
distclean: clean
	rm -f Makefile Makefile.bak

### To make the executable files smaller: type "make strip".
#
strip:
	strip $(EXECS)

### Profile-guided build: type "make pgo".
#
#    PGO compiles once with instrumentation, runs a training workload to record
#    which paths and branches the engine actually takes, then recompiles with
#    that profile. The binary is an ordinary -O3 build; only its inlining and
#    block layout are informed by real data.
#
#    The training run is the headless CQL benchmark (tests/cql/bench.tcl): it
#    imports a 20000 game MEMORY base and searches it, which is what makes the
#    matcher's relative block weights meaningful. Override it to train on
#    something else, e.g. a Tk session or a larger benchmark:
#
#      make pgo PGO_TRAIN="./scidCommunity tests/cql/bench.tcl tests/tcl/search_moves.pgn 100000 1000"
#
#    The binary initialises Tk even for a script, so a machine with no X server
#    must run the training under xvfb-run:
#
#      make pgo PGO_TRAIN="xvfb-run -a ./scidCommunity tests/cql/bench.tcl tests/tcl/search_moves.pgn 20000 1000"
#
#    -fprofile-correction: the search runs on several threads, whose counter
#    updates can race, and GCC then refuses the inconsistent profile without
#    it. It only relaxes the counters, not the generated code.
PGO_TRAIN = ./scidCommunity tests/cql/bench.tcl tests/tcl/search_moves.pgn 20000 1000
PGO_GENERATE = -fprofile-generate
PGO_USE = -fprofile-use -fprofile-correction

# The objects and the executable a PGO build produces; removed between the two
# compiles, and again if the training run fails.
PGO_OBJECTS = src/*.o src/cql/*.o src/polyglot/*.o src/tkdnd/unix/*.o $(EXECS)
PGO_DATA = src/*.gcda src/cql/*.gcda src/polyglot/*.gcda src/tkdnd/unix/*.gcda \
           src/*.gcno src/cql/*.gcno src/polyglot/*.gcno src/tkdnd/unix/*.gcno

pgo:
	$(MAKE) pgo_clean
	# Append to CXXFLAGS instead of replacing it, so flags the build already
	# carries (a distro's hardening flags, -march, ...) apply to both compiles.
	$(MAKE) CXXFLAGS="$(CXXFLAGS) $(PGO_GENERATE)" scidCommunity
	# If training fails, drop the instrumented binary: leaving it behind would
	# make a later plain `make` report "up to date" and ship an instrumented
	# executable that is slower and writes .gcda files on every exit.
	$(PGO_TRAIN) || { rm -f $(PGO_OBJECTS); exit 1; }
	rm -f $(PGO_OBJECTS)
	$(MAKE) CXXFLAGS="$(CXXFLAGS) $(PGO_USE)" scidCommunity
	rm -f $(PGO_DATA)

# Remove the objects and any profile data from an earlier PGO run. The
# executable is rebuilt, so the engines and the other targets stay as they are.
pgo_clean:
	rm -f $(PGO_OBJECTS)
	rm -f $(PGO_DATA)

### Generic rule for .cpp files:
#
src/%.o: src/%.cpp
	$(COMPILE) $(TCL_INCLUDE) -Isrc -Isrc/external $(CPP_FLAGS) -o $@ -c $<

# The CTG converter reports errors with exceptions, all caught inside ctg2obr().
src/polyglot/ctg2obr.o: CPP_FLAGS += -fexceptions

# CQL: the engine needs RTTI (dynamic_cast, overriding the release -fno-rtti)
# and the INTEGRATED library branch. It compiles warning-free with the same
# -Wall as the rest of the tree; do not add -Wno-* suppressions here.
src/cql/%.o: CPP_FLAGS += -frtti -DINTEGRATED

ifneq ($(shell uname),Darwin)
src/tkdnd/unix/%.o: src/tkdnd/unix/%.c
	$(COMPILE) -c -std=c++20 $(TCL_INCLUDE) $(OPTIMIZE) $(WARNINGS) $(DEBUG) $(SCIDFLAGS) -o $@ $<
endif

-include ${DEPENDS}
### End of Makefile
