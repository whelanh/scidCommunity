name: Build and Publish Snap

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built snap to the stable channel
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    # Must match base: core26 in snap/snapcraft.yaml. snapcraft refuses a
    # destructive-mode build when the host series differs from the base.
    # Pinned rather than ubuntu-latest so the host cannot drift out from
    # under the base again.
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Snapcraft
        run: |
          for attempt in 1 2 3; do
            if sudo snap install --classic snapcraft; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            echo "snap install failed (attempt $attempt/3), retrying in 20s..."
            sleep 20
          done

      - name: Build snap
        id: build
        run: |
          for attempt in 1 2 3; do
            if sudo snapcraft pack --destructive-mode; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            echo "snapcraft pack failed (attempt $attempt/3), retrying in 20s..."
            sleep 20
          done
          SNAP_FILE=$(ls *.snap)
          echo "snap=$SNAP_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload snap artifact
        uses: actions/upload-artifact@v7
        with:
          name: snap
          path: ${{ steps.build.outputs.snap }}

      - name: Publish to Snapcraft Store
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable
