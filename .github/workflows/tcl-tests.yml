name: Tcl Tests

on:
  push:
    branches: [github]
  pull_request:
    branches: [github]

permissions:
  contents: read

jobs:
  tcl-harnesses:
    name: Tcl harnesses (tclsh only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # tclsh is all these need: the transport, URL and parsing tests are pure
      # Tcl, Tk is stubbed inside the provider file, and the options test lifts
      # one procedure out of tcl/options.tcl.
      - name: Install Tcl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tcl

      - name: Startup source order
        run: tclsh tests/tcl/startup_order.tcl

      # No sc_* dispatch subcommand's abbreviation may be ambiguous: the Tcl
      # calls "sc_game tag" as an abbreviation of "tags", so a second
      # subcommand sharing that prefix (as "tagorder" once did) breaks every
      # such call. This fails if any Tcl abbreviation resolves to two entries.
      - name: Subcommand abbreviations
        run: tclsh tests/tcl/subcommand_prefix.tcl

      - name: Review toolbar icons
        run: tclsh tests/tcl/review_toolbar.tcl

      - name: Comment facts
        run: tclsh tests/tcl/comment_facts.tcl

      # The provenance spans: Game Review's green verdicts, the coach's blue
      # prose, and the strip that has to take a wrapper with its text.
      - name: Comment colours
        run: tclsh tests/tcl/comment_colors.tcl

      - name: Move labels
        run: tclsh tests/tcl/move_labels.tcl

      # The catalogue files and addLanguage must agree: a language added to one
      # but not the other never appears in the Language menu, and the other
      # harnesses read this list instead of keeping their own copy of it.
      - name: Language catalogues
        run: tclsh tests/tcl/language_catalogues.tcl

      # The CSV workbench used by native translators. Its self-test builds a
      # small catalogue, exports it, imports a partial sheet and checks the
      # validation, so the parser and serializer stay honest.
      - name: Translation workbench
        run: python3 tcl/lang/langtool.py selftest

      # The same for the help pages: blocks are cut and paired with English,
      # a link can move inside a sentence, a drifted page keeps its pairing,
      # and the file's line endings survive an import.
      - name: Help translation workbench
        run: python3 tcl/lang/helptool.py selftest

      # Woodpecker trainer: scoring, the single attempt, the puzzle marks, the cycle
      # schedule (quota, moved deadline) and the record files.
      - name: Woodpecker core
        run: tclsh tests/tcl/woodpecker_core.tcl

      - name: Woodpecker evaluation
        run: tclsh tests/tcl/woodpecker_eval.tcl

      - name: Woodpecker sets on disk
        run: tclsh tests/tcl/woodpecker_set.tcl

      # Repetition presentation: off/banner/dialog must not change the count,
      # and the Finish Game and autoplay passes must stay silent.
      - name: Repetition alert
        run: tclsh tests/tcl/repetition_alert.tcl

      - name: Score seed
        run: tclsh tests/tcl/score_seed.tcl

      - name: Game review settings
        run: tclsh tests/tcl/game_review.tcl

      - name: Review report
        run: tclsh tests/tcl/review_report.tcl

      - name: Performance rating
        run: tclsh tests/tcl/perf_rating.tcl

      - name: Review coach facts
        run: tclsh tests/tcl/review_coach.tcl

      # The queue and its transport without a board or a model: the stub curl on
      # PATH sleeps, so the async caller's timing is measured rather than assumed.
      - name: Review prose queue
        run: tclsh tests/tcl/review_prose.tcl

      # The threat probe (#422 item 4): one short search on its own connection,
      # closed in the reply that delivered the move, and the deterministic
      # answer the probe gives with no model configured.
      - name: Review threat probe
        run: tclsh tests/tcl/review_threat.tcl

      - name: Review transport
        run: tclsh tests/tcl/review_transport.tcl

      # The transport and the queue together, with a slow child on PATH: an
      # `after` fires while a request is in flight, twenty questions leave the
      # loop never stalled for longer than a heartbeat (the blocking entry point
      # is measured alongside as the control), and Cancel mid-flight closes the
      # run at once.
      - name: Review loop
        run: tclsh tests/tcl/review_loop.tcl

      # The Engine Window's messages as an EPD result record, without Tk: the
      # deepest-line rule, the answer-at-bestmove rule, SAN and ce encoding.
      - name: EPD result record
        run: tclsh tests/tcl/epd_analysis.tcl

      # Analyze Positions drives the Engine Window: the pass loads each position
      # on the board and reads the window's answer back, on the window's engine,
      # options and limits.
      - name: EPD analysis window
        run: tclsh tests/tcl/epd_analysis_window.tcl

      - name: Batch annotate
        run: tclsh tests/tcl/batch_annotate.tcl

      - name: Rapid annotate
        run: tclsh tests/tcl/rapid_annotate.tcl

      - name: Finish game
        run: tclsh tests/tcl/finish_game.tcl
      - name: Engine preset limits
        run: tclsh tests/tcl/engine_limits.tcl

      - name: Engine reply
        run: tclsh tests/tcl/engine_reply.tcl

      # Computer tournament: the PGN time control it writes, the repetition key
      # that decides a draw (castling rights and en passant included), and the
      # time-per-move deadline with its grace.
      - name: Computer tournament
        run: tclsh tests/tcl/multicomp.tcl

      - name: Review driver
        run: tclsh tests/tcl/review_driver.tcl

      # The cloud pre-pass: the comparison, the normalisation, the cache, and the
      # pass driven against a stubbed transport (no network in CI).
      - name: Review cloud pre-pass
        run: tclsh tests/tcl/review_cloud.tcl

      # The Brilliant/Great second opinion, without an engine: the pure decision
      # and the three writers that call the shared transform before they write.
      - name: Review verifier
        run: tclsh tests/tcl/review_verify.tcl

      # The verifier's search through the driver's own queue against a stub
      # second engine: the disagreement, the silent answer, an engine lost and
      # Cancel.
      - name: Review verifier engine
        run: tclsh tests/tcl/review_verify_engine.tcl

      # The two marks ::reviewannotate still owns for the review writer:
      # MarkTacticalExercises (the T flag and its difficulty comment) and
      # FindOpeningErrors (the Annotator tag's opening entry). The legacy
      # annotate pass and the tests that gated it went with the Analysis window
      # (#437 §5).
      - name: Review marks
        run: tclsh tests/tcl/review_marks.tcl

      - name: Review UI
        run: tclsh tests/tcl/review_ui.tcl

      # The progress pane (#422 item 3): the feed, the header for every source,
      # the bar's fraction from ::reviewui::passFraction, and the docking arm
      # that makes the surface a pane of the app rather than a window of its own.
      - name: Review progress pane
        run: tclsh tests/tcl/review_progress_pane.tcl

      # The notices this repository claims are the notices it keeps (#422).
      - name: Licensing
        run: tclsh tests/tcl/licensing.tcl

      - name: Engine preset duplicate
        run: tclsh tests/tcl/engine_duplicate.tcl

      # Discussion #535: F2/F3 start an explicitly assigned preset, by name, so
      # editing or sorting the engine list cannot change which one they open.
      - name: Engine window shortcuts
        run: tclsh tests/tcl/engine_window_slots.tcl

      # Item 3 of #436 and §5 of #437: no UI path reaches makeAnalysisWin, the
      # engine chooser opens an Engine Window, and the module itself is gone.
      - name: Analysis UI doors
        run: tclsh tests/tcl/analysis_doors.tcl

      - name: Help keys
        run: tclsh tests/tcl/help_keys.tcl

      # #437 §3a: Review game and Calvar are retired. The Training menu keeps
      # Openings and Tactics, and no file, key or help page survives them.
      - name: Training menu after the retirement
        run: tclsh tests/tcl/training_menu.tcl

      - name: Engine seed
        run: tclsh tests/tcl/engine_seed.tcl

      - name: Provider layer
        run: tclsh tests/tcl/auto_comment_provider.tcl

      - name: Options file save
        run: tclsh tests/tcl/options_write.tcl

      # Discussion #460: the PGN format preferences must reach the C++ writers,
      # not just the exporters. Each value travels via a small proc in
      # options.tcl and a variable trace, which is what makes compacting a PGN
      # database keep the move-number spacing (#534), the tag order and the
      # line endings.
      - name: PGN format preferences reach the writer
        run: tclsh tests/tcl/pgn_format_prefs.tcl

      # Discussion #486: the Tree Options checkbutton, the last used mask
      # opening with the tree, and no modal error when that mask has gone.
      - name: Tree mask auto-load
        run: tclsh tests/tcl/mask_autoload.tcl

      # The Header search's presets: a save stores every field and both array
      # fields, a load clears a field the preset does not carry, a delete takes
      # the name out of the menu, and the dead Save button is gone.
      - name: Search presets
        run: tclsh tests/tcl/search_presets.tcl

      # The downloader's failure and cancel paths: a failed curl/wget must not
      # install a truncated file, and cancel must kill the child, not wait on it.
      - name: Update download
        run: tclsh tests/tcl/updatecheck_download.tcl

      # Cancelling a Tree refresh clears a pending training move on the
      # training base, but not when a different base is cancelled.
      - name: Tree cancel clears a pending training move
        run: tclsh tests/tcl/tree_cancel_training.tcl

      # Lichess Puzzles against a fake Lichess: each Difficulty entry sends
      # its own value of the five the API accepts (old saved values mapped),
      # only puzzles of the asked side are queued or shown, and all three
      # transports (curl, Tcl http, PowerShell) send a User-Agent.
      - name: Lichess puzzles requests
        run: tclsh tests/tcl/lichess_puzzles.tcl

  tk-dialogs:
    name: dialogs under Tk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # These build real widgets, so they need Tk and a display. Xvfb
      # supplies the display; nothing is drawn anywhere the user can see.
      - name: Install Tcl, Tk and Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tcl tk xvfb

      - name: Auto Comment dialogs
        run: xvfb-run -a wish tests/tcl/auto_comment_dialogs.tcl

      # My Player Names: a fixed 440-high window cut off the OK row as soon as a
      # larger UI font or a HiDPI display wrapped the description onto another
      # line. The harness opens it at the default size and at 200% scaling and
      # checks every button is inside the window.
      - name: My Player Names dialog
        run: xvfb-run -a wish tests/tcl/player_names_dialog_tk.tcl

      # The same harness on a display shorter than the dialog's own content. There
      # the window opens clamped, and the minimum size is what keeps the button row
      # inside once the window is dragged smaller.
      - name: My Player Names dialog on a short display
        run: xvfb-run -a -s "-screen 0 800x480x24" wish tests/tcl/player_names_dialog_tk.tcl

      # The Review Settings dialog: the tclsh harnesses decide what it stores,
      # but only building it shows that the proc holding the widgets compiles
      # and that the OK button is there to press.
      - name: Review Settings dialog
        run: xvfb-run -a wish tests/tcl/review_settings_dialog.tcl

      # The PGN Export preferences page: the tag-order list, and the
      # line-ending choice added for #534 so a compacted PGN database follows
      # the same preferences as an export. A tclsh harness cannot build the
      # widgets; this one does, and picks each combobox entry.
      - name: PGN export preferences
        run: xvfb-run -a wish tests/tcl/pgn_export_prefs_tk.tcl

      # The cloud pre-pass switch as engine configuration: the engine options
      # panel draws it, ::enginecfg::save writes it into engines.dat, a second
      # handshake keeps it, and ::review::engineDefaults reads it back.
      - name: Engine review pre-pass options
        run: xvfb-run -a wish tests/tcl/engine_review_options_tk.tcl

      # The Comment Window's own colour: the Format menu's entry, the saved
      # ::pgnColor(Comment), and the editor following it.
      - name: Comment default colour
        run: xvfb-run -a wish tests/tcl/comment_default_color_tk.tcl

      # #542: the Format menu's colours are the board marker palette, shown as
      # squares, and the Info Bar prints a coloured comment rather than its
      # span tags.
      - name: Comment Info Bar and palette
        run: xvfb-run -a wish tests/tcl/comment_infobar_tk.tcl

      # The repetition banner must not grab or take focus, and a second one
      # replaces the first rather than stacking.
      - name: Repetition notice
        run: xvfb-run -a wish tests/tcl/repetition_notice_tk.tcl

      # #531: the tip window is an htext widget on the theme's own background,
      # so its links were X11 blue on cobalt2 (1.8:1). The colour now follows
      # the background, the yellow hover highlight takes the foreground with it,
      # and a theme change recolours the links already drawn.
      - name: Help text link colours
        run: xvfb-run -a wish tests/tcl/htext_link_colors.tcl

      # A help page named <button tb_review_threat>, an icon that exists only as
      # ::icon::tb_review_threat: the error ended "What's the threat?" at that
      # tag. A bare icon name now falls back to ::icon::, and a name that exists
      # nowhere no longer ends the page.
      - name: Help text icons
        run: xvfb-run -a wish tests/tcl/htext_icons.tcl

      # An old layout naming .analysisWin1 must draw nothing now that the
      # Analysis window has no restore door (#436 item 3).
      - name: Window layout
        run: xvfb-run -a wish tests/tcl/layout_windows.tcl

      # Hyprland on a floating workspace resizes and recentres every window
      # that opens, Tk's menu windows included, so menus come up as large
      # squares that cover each other. The harness plays the compositor and
      # checks every menu returns to the geometry Tk posted it with.
      - name: Menus under Hyprland
        run: xvfb-run -a wish tests/tcl/hyprland_menus_tk.tcl

      # The Header search's Presets menu: rebuilding it twice, two names that
      # used to share a submenu, and the Load and Delete entries a user clicks.
      - name: Search presets menu
        run: xvfb-run -a wish tests/tcl/search_presets_tk.tcl

      # The Engine Window's PV display keeps one block per depth in a MultiPV
      # run (discussion #461): a dashed rule between blocks, the best line in
      # blue, the newest block refreshed in place. The single-PV display is
      # unchanged.
      - name: Engine PV display
        run: xvfb-run -a wish tests/tcl/engine_display_tk.tcl

      # The engine options panel beside the Name field: a Hyprland-centered
      # dialog keeps the width it had when it was mapped, so the panel used to
      # be gridded outside it and the settings button looked dead.
      - name: Engine options dialog
        run: xvfb-run -a wish tests/tcl/engine_options_dialog_tk.tcl

      # The tclsh Training-menu harness checks the menu statically; it cannot
      # run the Tactics trainer's own loop. This does, on a window built the
      # way the menu builds it - start against a preset, one puzzle, a right
      # and a wrong answer, the analysis timer expiring, and stop (#437 §3a).
      - name: Tactics trainer
        run: xvfb-run -a wish tests/tcl/tactics_trainer.tcl

      # Play versus Engine's own engine connections (#437 §4a): the transport
      # is ::enginecomm for real over a socket pair, the engine on the far end
      # is fake, and the scenarios are a go answered by a reply, a search
      # replaced by a second go, a cancel and a dead engine - none of them
      # leaving a wait behind - plus the coach on its own connection.
      # The behaviour half (#437 §4b) rides on the same fake: the clock each
      # search is given, a takeback, the coach's thresholds and its dialog,
      # ponder, the [%eval] written on a move, the four ways a game ends, and a
      # second session after an abnormal one.
      - name: Play versus Engine engine layer
        run: xvfb-run -a wish tests/tcl/sergame_engine.tcl

      # The window's reader-facing choices: the two clock faces in one row with
      # a minimum size that holds them, the face the preference asks for, and
      # where a mid-game Play takes its clocks from. Separate from the engine
      # harness because this one runs ::gameclock for real.
      - name: Play versus Engine window
        run: xvfb-run -a wish tests/tcl/sergame_ui.tcl

      - name: Finish Game dialog
        run: xvfb-run -a wish tests/tcl/finish_game_dialog.tcl

      # The progress pane's widgets (#422 item 3): built through the real
      # docking layer, an explicit psize, no bindings, and a hidden tab that
      # draws the current position when it comes back.
      - name: Review progress pane
        run: xvfb-run -a wish tests/tcl/review_progress_pane_tk.tcl

      # The Lichess study feature against a fake Lichess: games into an
      # existing or a new study, the 64-chapter limit, the "study is full"
      # question, API errors, and how curl is called.
      - name: Lichess study
        run: xvfb-run -a wish tests/tcl/lichess_study_tk.tcl

      # The Moves search window: the widgets build under real Tk and the Search
      # button hands sc_search_moves the move list, side and mate flag in order.
      - name: Moves search window
        run: xvfb-run -a wish tests/tcl/search_moves_tk.tcl

      # The two redraw promises the game-over dialogs rely on: waitForAnimation
      # must force Tk's own update (not ::board::update), and a cancelled
      # animation must not leave the moving flag set.
      - name: Board animation and redraw
        run: xvfb-run -a wish tests/tcl/board_animation_tk.tcl

      # The board screenshot composes the board's own piece and square photos,
      # so it must make a valid PNG without TkImg, in both orientations, with
      # coordinates, and number the files automatically.
      - name: Board screenshot
        run: xvfb-run -a wish tests/tcl/board_image_tk.tcl

      # The CQL search window: the box, the filter operation the button carries
      # to sc_search cql, the empty-query dialog, a failed query reported rather
      # than raised, and every catalogue carrying the window's strings.
      - name: CQL search window
        run: xvfb-run -a wish tests/tcl/search_cql_tk.tcl

  startup-smoke:
    name: startup with a clean profile
    runs-on: ubuntu-latest
    # apt on a hosted runner occasionally stalls on a mirror; a stuck install
    # should fail here rather than sit until the six-hour job limit.
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The imported CQL engine is updated to C++20 and compiles warning-free
      # (see src/cql/README.md). Keep it that way instead of silencing the
      # warnings in the build files.
      - name: CQL engine warning-free
        run: src/cql/scripts/check-warnings.sh

      # The app itself, not a harness: a clean profile has no options.dat, so
      # the built-in layout is restored and it docks .engineWin1. v5.1.4.50
      # sourced end.tcl before the modules that window calls, and every such
      # start died before the event loop. Nothing Tcl-level can see that; only
      # booting the binary can.
      # cmake, make and g++ are in the runner image; only the Tcl/Tk headers
      # and Xvfb are missing.
      - name: Install Tk headers and Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tcl8.6-dev tk8.6-dev xvfb

      - name: Build and install
        # A release build always sets this (release.yml does). Without it the
        # shallow checkout has no tags, so CMake's `git describe` stamps the
        # commit hash, and start.tcl's "5.1" version check cannot parse it.
        env:
          SCIDCOMMUNITY_VERSION: 5.1.4.0
        run: |
          cmake -S . -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j"$(nproc)"
          DESTDIR="$PWD/AppDir" cmake --install build

      - name: Start with a clean profile
        env:
          STARTUP_SMOKE_SECONDS: 10
        run: xvfb-run -a tests/startup_smoke.sh "$PWD/AppDir/usr/bin/scidCommunity"

      # The built binary's own sc_game info: the Game Info panel must show
      # comment text, not the comment editor's colour markup.
      - name: Game Info comment markup
        run: xvfb-run -a "$PWD/AppDir/usr/bin/scidCommunity" tests/tcl/game_info_comment.tcl

      # The Name Editor's '*' wildcard through the built binary's sc_name
      # commands: prefix/suffix/substring patterns, the filter selection, and
      # the player-name match on the Rating tab.
      - name: Name Editor wildcards
        run: xvfb-run -a "$PWD/AppDir/usr/bin/scidCommunity" tests/tcl/name_editor_wildcard.tcl

      # An in-progress online game is updated in place when its finished PGN
      # arrives, rather than adding a second copy.
      - name: Import updates an online game by Link
        run: xvfb-run -a "$PWD/AppDir/usr/bin/scidCommunity" tests/tcl/import_nodup_link.tcl

      # sc_base import of a ChessBase 2CBH database built byte by byte (2027
      # layout): the binary picks the reader by the .2cbh extension.
      - name: Import a ChessBase 2CBH database
        run: xvfb-run -a "$PWD/AppDir/usr/bin/scidCommunity" tests/tcl/cb2_import.tcl

      # Book Tuning's Remove Move + Save: the move must be gone from the book
      # after a save and a re-read, not rewritten at full weight.
      - name: Remove Move deletes the move
        run: xvfb-run -a "$PWD/AppDir/usr/bin/scidCommunity" tests/tcl/book_remove_play.tcl

      # The binary's own repetition counter driving each presentation: the
      # count that ends a finished game must be the count the notice uses.
      - name: Repetition detection and notice
        run: xvfb-run -a "$PWD/AppDir/usr/bin/scidCommunity" tests/tcl/repetition_integration.tcl

      # The binary's own move-sequence search: the filter it leaves behind is
      # what the game list opens at, so the ply is checked through sc_game.
      - name: Move sequence search
        run: xvfb-run -a "$PWD/AppDir/usr/bin/scidCommunity" tests/tcl/search_moves.tcl

      # The board screenshot again, against the binary's own game commands: the
      # marks must come out of a real comment and the badges out of the real
      # NAGs, which a plain PGN gives as $18 rather than +-. The wish harness
      # stubs both, so it cannot see that difference.
      - name: Board screenshot from real game data
        run: xvfb-run -a "$PWD/AppDir/usr/bin/scidCommunity" tests/tcl/board_image_scid.tcl

      # sc_search cql itself, headless: a script argument runs the binary with
      # no window and no menus, so this finishes in well under a second. It
      # still needs a display, because the binary initialises Tk, hence
      # xvfb-run. It checks the index pre-filters, the filter operations and a
      # 3000-game base big enough to take the multi-threaded path, which the
      # window harness cannot reach as cheaply.
      - name: CQL engine checks
        run: xvfb-run -a "$PWD/AppDir/usr/bin/scidCommunity" tests/cql/check.tcl

      # The binary's own CQL search through the window the Search menu opens:
      # the query in the box, the filter operation, the result in the database
      # filter, and the empty and rejected queries reported rather than raised.
      - name: CQL search
        run: xvfb-run -a "$PWD/AppDir/usr/bin/scidCommunity" tests/tcl/search_cql.tcl

      # Every query the CQL building blocks can write, for every value in every
      # spinbox, through the real engine. A block that writes a query the
      # parser rejects would otherwise only be found by a user clicking it.
      - name: CQL building blocks
        run: xvfb-run -a "$PWD/AppDir/usr/bin/scidCommunity" tests/tcl/search_cql_kit.tcl

      # The CQL search over a base holding a game whose .sg4 record cannot be
      # decoded: the search must skip that game and still fill the filter,
      # which is the path 6e7b52ca fixed for a 4.45M-game database with one bad
      # record in it. The harness damages the record itself, so it needs a
      # file-based base rather than a MEMORY one, and nothing else in CI
      # reaches that path.
      - name: CQL search over an unreadable game
        run: xvfb-run -a "$PWD/AppDir/usr/bin/scidCommunity" tests/tcl/search_cql_unreadable.tcl

      # Every query printed on the CQL help page, through the same engine: the
      # page's samples cannot drift away from what the parser accepts without
      # this failing, which is the point of the page.
      - name: CQL help page examples
        run: xvfb-run -a "$PWD/AppDir/usr/bin/scidCommunity" tests/tcl/help_cql_examples.tcl

  # Tcl 9.0: what current Ubuntu and Kubuntu install, and what broke v5.1.4.68.
  # sc_search_moves handed Tcl_SplitList an int count behind a CONST84 cast; 9.0
  # made the count a Tcl_Size and dropped CONST84, and the app did not compile.
  # Every other job here installs 8.6, so nothing else in this file can see that
  # class of break. This job builds 9.0 from the release tag, compiles the app
  # against it, and then runs the whole suite - the other two jobs' own command
  # lists, the boot smoke, and the binary harnesses - under 9.0.
  tcl9:
    name: Tcl 9.0
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # No runner image ships Tcl 9 yet, so it is built here. Xft, fontconfig
      # and CUPS are what Tk links against; installing them keeps this Tk the
      # same Tk that the link below is written for.
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential libx11-dev libxft-dev libfontconfig1-dev \
            libcups2-dev xvfb

      # Pinned to the tag: a job that followed a branch would go red on someone
      # else's commit. Bump the tag when a new 9.0.x ships.
      - name: Build Tcl and Tk 9.0
        run: |
          set -eux
          TCL9="$RUNNER_TEMP/tcl9"
          mkdir -p "$TCL9/src" && cd "$TCL9/src"
          git clone -q --depth 1 -b core-9-0-4 https://github.com/tcltk/tcl.git tcl
          git clone -q --depth 1 -b core-9-0-4 https://github.com/tcltk/tk.git tk
          (
            cd tcl/unix
            ./configure --prefix="$TCL9/inst" --enable-shared=no
            make -j"$(nproc)"
            make install
          )
          # --disable-zipfs: a static Tk otherwise asks for a minizip rule that
          # only the Tcl build defines, and stops with "No rule to make target".
          (
            cd tk/unix
            ./configure --prefix="$TCL9/inst" --with-tcl="$TCL9/src/tcl/unix" \
                        --enable-shared=no --disable-zipfs
            make -j"$(nproc)"
            make install
          )

      - name: Build and install against 9.0
        # FindTCL would otherwise pair the 9.0 headers with the image's 8.6
        # libraries: both have to be named. SCIDCOMMUNITY_VERSION because a
        # shallow checkout has no tags for `git describe` (release.yml sets it).
        env:
          SCIDCOMMUNITY_VERSION: 5.1.4.0
        run: |
          set -eux
          TCL9="$RUNNER_TEMP/tcl9"
          # The Tcl and Tk archives are static and reference zlib (Tcl) and
          # X11/Xft/fontconfig/cups (Tk). Those libraries must be linked AFTER
          # the archives, but CMAKE_EXE_LINKER_FLAGS is placed before the
          # objects - a static link then leaves the references unresolved.
          # CMAKE_CXX_STANDARD_LIBRARIES is placed at the end, after
          # target_link_libraries, which is where the Tcl/Tk archives sit.
          cmake -S . -B build-tcl9 \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/usr \
                -DTCL_INCLUDE_PATH="$TCL9/inst/include" \
                -DTK_INCLUDE_PATH="$TCL9/inst/include" \
                -DTCL_LIBRARY="$TCL9/inst/lib/libtcl9.0.a" \
                -DTK_LIBRARY="$TCL9/inst/lib/libtcl9tk9.0.a" \
                -DCMAKE_CXX_STANDARD_LIBRARIES="-lcups -lXft -lfontconfig -lX11 -ldl -lz -lm -lpthread"
          cmake --build build-tcl9 -j"$(nproc)"
          DESTDIR="$PWD/AppDir" cmake --install build-tcl9

      # Each list below is read out of the job that owns it, so a harness added
      # above is covered here without a second list to keep in step - and an
      # empty list fails rather than reading as a green run.
      - name: Tcl harnesses under 9.0
        run: |
          set -u
          TCL9="$RUNNER_TEMP/tcl9"
          files=$(grep -oE 'run: tclsh tests/tcl/[a-z_0-9]+\.tcl' .github/workflows/tcl-tests.yml \
                  | sed 's|run: tclsh ||')
          test -n "$files"
          fail=0
          for f in $files; do
            echo "::group::$f"
            "$TCL9/inst/bin/tclsh9.0" "$f" \
              || { echo "::error file=$f::fails under Tcl 9.0"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail

      - name: Dialog harnesses under Tk 9.0
        run: |
          set -u
          TCL9="$RUNNER_TEMP/tcl9"
          # A 9.0 `make install` writes no lib/tcl9.0, so the binaries are
          # pointed at the source library tree and at Tk's installed one.
          export TCL_LIBRARY="$TCL9/src/tcl/library"
          export TK_LIBRARY="$TCL9/inst/lib/tk9.0"
          files=$(grep -oE 'run: xvfb-run -a wish tests/tcl/[a-z_0-9]+\.tcl' .github/workflows/tcl-tests.yml \
                  | sed 's|run: xvfb-run -a wish ||')
          test -n "$files"
          fail=0
          for f in $files; do
            echo "::group::$f"
            xvfb-run -a "$TCL9/inst/bin/wish9.0" "$f" \
              || { echo "::error file=$f::fails under Tk 9.0"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail

      # The built binary, not a harness: the C++ commands behind sc_* are what
      # 9.0 changed, and only booting the thing exercises them through the new
      # Tcl's own list and object handling.
      - name: Boot and binary harnesses under 9.0
        env:
          STARTUP_SMOKE_SECONDS: 10
        run: |
          set -u
          TCL9="$RUNNER_TEMP/tcl9"
          export TCL_LIBRARY="$TCL9/src/tcl/library"
          export TK_LIBRARY="$TCL9/inst/lib/tk9.0"
          fail=0
          xvfb-run -a tests/startup_smoke.sh "$PWD/AppDir/usr/bin/scidCommunity" \
            || { echo "::error::the app does not boot on Tcl 9.0"; fail=1; }
          files=$(grep -oE 'AppDir/usr/bin/scidCommunity"? tests/(tcl|cql)/[a-z_0-9]+\.tcl' \
                    .github/workflows/tcl-tests.yml | sed 's|^.*\(tests/\)|\1|')
          test -n "$files"
          for f in $files; do
            echo "::group::$f"
            xvfb-run -a "$PWD/AppDir/usr/bin/scidCommunity" "$f" \
              || { echo "::error file=$f::fails against a Tcl 9.0 build"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail
