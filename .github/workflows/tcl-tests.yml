name: Tcl Tests

on:
  push:
    branches: [github]
  pull_request:
    branches: [github]

permissions:
  contents: read

jobs:
  tcl-harnesses:
    name: Tcl harnesses (tclsh only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # tclsh is all these need: the transport, URL and parsing tests are pure
      # Tcl, Tk is stubbed inside the provider file, and the options test lifts
      # one procedure out of tcl/options.tcl.
      - name: Install Tcl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tcl

      - name: Startup source order
        run: tclsh tests/tcl/startup_order.tcl

      # No sc_* dispatch subcommand's abbreviation may be ambiguous: the Tcl
      # calls "sc_game tag" as an abbreviation of "tags", so a second
      # subcommand sharing that prefix (as "tagorder" once did) breaks every
      # such call. This fails if any Tcl abbreviation resolves to two entries.
      - name: Subcommand abbreviations
        run: tclsh tests/tcl/subcommand_prefix.tcl

      - name: Review toolbar icons
        run: tclsh tests/tcl/review_toolbar.tcl

      - name: Comment facts
        run: tclsh tests/tcl/comment_facts.tcl

      # The provenance spans: Game Review's green verdicts, the coach's blue
      # prose, and the strip that has to take a wrapper with its text.
      - name: Comment colours
        run: tclsh tests/tcl/comment_colors.tcl

      - name: Move labels
        run: tclsh tests/tcl/move_labels.tcl

      # Repetition presentation: off/banner/dialog must not change the count,
      # and the Finish Game and autoplay passes must stay silent.
      - name: Repetition alert
        run: tclsh tests/tcl/repetition_alert.tcl

      - name: Score seed
        run: tclsh tests/tcl/score_seed.tcl

      - name: Game review settings
        run: tclsh tests/tcl/game_review.tcl

      - name: Review report
        run: tclsh tests/tcl/review_report.tcl

      - name: Review coach facts
        run: tclsh tests/tcl/review_coach.tcl

      # The queue and its transport without a board or a model: the stub curl on
      # PATH sleeps, so the async caller's timing is measured rather than assumed.
      - name: Review prose queue
        run: tclsh tests/tcl/review_prose.tcl

      # The threat probe (#422 item 4): one short search on its own connection,
      # closed in the reply that delivered the move, and the deterministic
      # answer the probe gives with no model configured.
      - name: Review threat probe
        run: tclsh tests/tcl/review_threat.tcl

      - name: Review transport
        run: tclsh tests/tcl/review_transport.tcl

      # The EPD window's headless analysis session: one connection, one
      # position at a time, the result record the EPD writer consumes.
      - name: EPD headless analysis
        run: tclsh tests/tcl/epd_analysis.tcl

      # Analyze Positions used to open its Analysis window by itself. The pass
      # now raises (or opens) an Engine Window on the same preset, while still
      # running on its own connection.
      - name: EPD analysis window
        run: tclsh tests/tcl/epd_analysis_window.tcl

      - name: Batch annotate
        run: tclsh tests/tcl/batch_annotate.tcl

      - name: Rapid annotate
        run: tclsh tests/tcl/rapid_annotate.tcl

      - name: Finish game
        run: tclsh tests/tcl/finish_game.tcl
      - name: Engine preset limits
        run: tclsh tests/tcl/engine_limits.tcl

      - name: Engine reply
        run: tclsh tests/tcl/engine_reply.tcl

      - name: Review driver
        run: tclsh tests/tcl/review_driver.tcl

      # The Brilliant/Great second opinion, without an engine: the pure decision
      # and the three writers that call the shared transform before they write.
      - name: Review verifier
        run: tclsh tests/tcl/review_verify.tcl

      # The verifier's search through the driver's own queue against a stub
      # second engine: the disagreement, the silent answer, an engine lost and
      # Cancel.
      - name: Review verifier engine
        run: tclsh tests/tcl/review_verify_engine.tcl

      - name: Annotate writers
        run: tclsh tests/tcl/annotate_writers.tcl

      # The gate for issue #380 phase C: the classic annotator and the review
      # write the same export artefacts into the same game.
      - name: Annotate parity
        run: tclsh tests/tcl/annotate_parity.tcl

      # The dialog's decision (a pure proc, no Tk). The run that decision
      # starts is the next step, and the no-display syntax check of the two Tk
      # procs it calls the one after. Nothing here builds the dialog's widgets,
      # and the Tk job below does not run them either.
      - name: Annotate dialog
        run: tclsh tests/tcl/annotate_dialog.tcl

      - name: Annotate run
        run: tclsh tests/tcl/annotate_run.tcl

      # A pass cancelled mid-batch (the user opens another game) must save
      # nothing, advance nowhere and give the borrowed game back.
      - name: Annotate cancel
        run: tclsh tests/tcl/annotate_cancel.tcl

      - name: Annotate dialog syntax
        run: tclsh tests/tcl/annotate_dialog_syntax.tcl

      - name: Review UI
        run: tclsh tests/tcl/review_ui.tcl

      # The progress pane (#422 item 3): the feed, the header for every source,
      # the bar's fraction from ::reviewui::passFraction, and the docking arm
      # that makes the surface a pane of the app rather than a window of its own.
      - name: Review progress pane
        run: tclsh tests/tcl/review_progress_pane.tcl

      # The notices this repository claims are the notices it keeps (#422).
      - name: Licensing
        run: tclsh tests/tcl/licensing.tcl

      - name: Engine preset duplicate
        run: tclsh tests/tcl/engine_duplicate.tcl

      # Item 3 of #436: no UI path reaches makeAnalysisWin, and the engine
      # chooser opens an Engine Window.
      - name: Analysis UI doors
        run: tclsh tests/tcl/analysis_doors.tcl

      - name: Help keys
        run: tclsh tests/tcl/help_keys.tcl

      # #437 §3a: Review game and Calvar are retired. The Training menu keeps
      # Openings and Tactics, and no file, key or help page survives them.
      - name: Training menu after the retirement
        run: tclsh tests/tcl/training_menu.tcl

      - name: Engine seed
        run: tclsh tests/tcl/engine_seed.tcl

      - name: Provider layer
        run: tclsh tests/tcl/auto_comment_provider.tcl

      - name: Options file save
        run: tclsh tests/tcl/options_write.tcl

      # The downloader's failure and cancel paths: a failed curl/wget must not
      # install a truncated file, and cancel must kill the child, not wait on it.
      - name: Update download
        run: tclsh tests/tcl/updatecheck_download.tcl

  tk-dialogs:
    name: dialogs under Tk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # These build real widgets, so they need Tk and a display. Xvfb
      # supplies the display; nothing is drawn anywhere the user can see.
      - name: Install Tcl, Tk and Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tcl tk xvfb

      - name: Auto Comment dialogs
        run: xvfb-run -a wish tests/tcl/auto_comment_dialogs.tcl

      # The Review Settings dialog: the tclsh harnesses decide what it stores,
      # but only building it shows that the proc holding the widgets compiles
      # and that the OK button is there to press.
      - name: Review Settings dialog
        run: xvfb-run -a wish tests/tcl/review_settings_dialog.tcl

      # The Comment Window's own colour: the Format menu's entry, the saved
      # ::pgnColor(Comment), and the editor following it.
      - name: Comment default colour
        run: xvfb-run -a wish tests/tcl/comment_default_color_tk.tcl

      # The repetition banner must not grab or take focus, and a second one
      # replaces the first rather than stacking.
      - name: Repetition notice
        run: xvfb-run -a wish tests/tcl/repetition_notice_tk.tcl

      # An old layout naming .analysisWin1 must draw nothing now that the
      # Analysis window has no restore door (#436 item 3).
      - name: Window layout
        run: xvfb-run -a wish tests/tcl/layout_windows.tcl

      # The Engine Window's PV display keeps one block per depth in a MultiPV
      # run (discussion #461): a dashed rule between blocks, the best line in
      # blue, the newest block refreshed in place. The single-PV display is
      # unchanged.
      - name: Engine PV display
        run: xvfb-run -a wish tests/tcl/engine_display_tk.tcl

      # The engine options panel beside the Name field: a Hyprland-centered
      # dialog keeps the width it had when it was mapped, so the panel used to
      # be gridded outside it and the settings button looked dead.
      - name: Engine options dialog
        run: xvfb-run -a wish tests/tcl/engine_options_dialog_tk.tcl

      # The tclsh Training-menu harness checks the menu statically; it cannot
      # run the Tactics trainer's own loop. This does, on a window built the
      # way the menu builds it - start against a preset, one puzzle, a right
      # and a wrong answer, the analysis timer expiring, and stop (#437 §3a).
      - name: Tactics trainer
        run: xvfb-run -a wish tests/tcl/tactics_trainer.tcl

      # Play versus Engine's own engine connections (#437 §4a): the transport
      # is ::enginecomm for real over a socket pair, the engine on the far end
      # is fake, and the scenarios are a go answered by a reply, a search
      # replaced by a second go, a cancel and a dead engine - none of them
      # leaving a wait behind - plus the coach on its own connection.
      # The behaviour half (#437 §4b) rides on the same fake: the clock each
      # search is given, a takeback, the coach's thresholds and its dialog,
      # ponder, the [%eval] written on a move, the four ways a game ends, and a
      # second session after an abnormal one.
      - name: Play versus Engine engine layer
        run: xvfb-run -a wish tests/tcl/sergame_engine.tcl

      - name: Finish Game dialog
        run: xvfb-run -a wish tests/tcl/finish_game_dialog.tcl

      # The progress pane's widgets (#422 item 3): built through the real
      # docking layer, an explicit psize, no bindings, and a hidden tab that
      # draws the current position when it comes back.
      - name: Review progress pane
        run: xvfb-run -a wish tests/tcl/review_progress_pane_tk.tcl

      # The Lichess study feature against a fake Lichess: games into an
      # existing or a new study, the 64-chapter limit, the "study is full"
      # question, API errors, and how curl is called.
      - name: Lichess study
        run: xvfb-run -a wish tests/tcl/lichess_study_tk.tcl

  startup-smoke:
    name: startup with a clean profile
    runs-on: ubuntu-latest
    # apt on a hosted runner occasionally stalls on a mirror; a stuck install
    # should fail here rather than sit until the six-hour job limit.
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The app itself, not a harness: a clean profile has no options.dat, so
      # the built-in layout is restored and it docks .engineWin1. v5.1.4.50
      # sourced end.tcl before the modules that window calls, and every such
      # start died before the event loop. Nothing Tcl-level can see that; only
      # booting the binary can.
      # cmake, make and g++ are in the runner image; only the Tcl/Tk headers
      # and Xvfb are missing.
      - name: Install Tk headers and Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tcl8.6-dev tk8.6-dev xvfb

      - name: Build and install
        # A release build always sets this (release.yml does). Without it the
        # shallow checkout has no tags, so CMake's `git describe` stamps the
        # commit hash, and start.tcl's "5.1" version check cannot parse it.
        env:
          SCIDCOMMUNITY_VERSION: 5.1.4.0
        run: |
          cmake -S . -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j"$(nproc)"
          DESTDIR="$PWD/AppDir" cmake --install build

      - name: Start with a clean profile
        env:
          STARTUP_SMOKE_SECONDS: 10
        run: xvfb-run -a tests/startup_smoke.sh "$PWD/AppDir/usr/bin/scidCommunity"

      # The built binary's own sc_game info: the Game Info panel must show
      # comment text, not the comment editor's colour markup.
      - name: Game Info comment markup
        run: xvfb-run -a "$PWD/AppDir/usr/bin/scidCommunity" tests/tcl/game_info_comment.tcl

      # An in-progress online game is updated in place when its finished PGN
      # arrives, rather than adding a second copy.
      - name: Import updates an online game by Link
        run: xvfb-run -a "$PWD/AppDir/usr/bin/scidCommunity" tests/tcl/import_nodup_link.tcl

      # The Twin Checker must delete the shorter copy and keep the fuller one,
      # and must never delete a newer stripped copy merely because an older
      # commented copy is immune.
      - name: Twin Checker keeps the fuller/newer copy
        run: xvfb-run -a "$PWD/AppDir/usr/bin/scidCommunity" tests/tcl/twin_keep_full.tcl

      # The binary's own repetition counter driving each presentation: the
      # count that ends a finished game must be the count the notice uses.
      - name: Repetition detection and notice
        run: xvfb-run -a "$PWD/AppDir/usr/bin/scidCommunity" tests/tcl/repetition_integration.tcl
