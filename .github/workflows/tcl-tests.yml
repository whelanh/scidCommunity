name: Tcl Tests

on:
  push:
    branches: [github]
  pull_request:
    branches: [github]

permissions:
  contents: read

jobs:
  tcl-harnesses:
    name: Tcl harnesses (tclsh only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # tclsh is all these need: the transport, URL and parsing tests are pure
      # Tcl, Tk is stubbed inside the provider file, and the options test lifts
      # one procedure out of tcl/options.tcl.
      - name: Install Tcl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tcl

      - name: Startup source order
        run: tclsh tests/tcl/startup_order.tcl

      - name: Review toolbar icons
        run: tclsh tests/tcl/review_toolbar.tcl

      - name: Comment facts
        run: tclsh tests/tcl/comment_facts.tcl

      # The provenance spans: Game Review's green verdicts, the coach's blue
      # prose, and the strip that has to take a wrapper with its text.
      - name: Comment colours
        run: tclsh tests/tcl/comment_colors.tcl

      - name: Move labels
        run: tclsh tests/tcl/move_labels.tcl

      - name: Score seed
        run: tclsh tests/tcl/score_seed.tcl

      - name: Game review settings
        run: tclsh tests/tcl/game_review.tcl

      - name: Review report
        run: tclsh tests/tcl/review_report.tcl

      - name: Review coach facts
        run: tclsh tests/tcl/review_coach.tcl

      # The queue and its transport without a board or a model: the stub curl on
      # PATH sleeps, so the async caller's timing is measured rather than assumed.
      - name: Review prose queue
        run: tclsh tests/tcl/review_prose.tcl

      - name: Review transport
        run: tclsh tests/tcl/review_transport.tcl

      - name: Batch annotate
        run: tclsh tests/tcl/batch_annotate.tcl

      - name: Rapid annotate
        run: tclsh tests/tcl/rapid_annotate.tcl

      - name: Finish game
        run: tclsh tests/tcl/finish_game.tcl
      - name: Engine preset limits
        run: tclsh tests/tcl/engine_limits.tcl

      - name: Engine reply
        run: tclsh tests/tcl/engine_reply.tcl

      - name: Review driver
        run: tclsh tests/tcl/review_driver.tcl

      - name: Annotate writers
        run: tclsh tests/tcl/annotate_writers.tcl

      # The gate for issue #380 phase C: the classic annotator and the review
      # write the same export artefacts into the same game.
      - name: Annotate parity
        run: tclsh tests/tcl/annotate_parity.tcl

      # The dialog's decision (a pure proc, no Tk). The run that decision
      # starts is the next step, and the no-display syntax check of the two Tk
      # procs it calls the one after. Nothing here builds the dialog's widgets,
      # and the Tk job below does not run them either.
      - name: Annotate dialog
        run: tclsh tests/tcl/annotate_dialog.tcl

      - name: Annotate run
        run: tclsh tests/tcl/annotate_run.tcl

      # A pass cancelled mid-batch (the user opens another game) must save
      # nothing, advance nowhere and give the borrowed game back.
      - name: Annotate cancel
        run: tclsh tests/tcl/annotate_cancel.tcl

      - name: Annotate dialog syntax
        run: tclsh tests/tcl/annotate_dialog_syntax.tcl

      - name: Review UI
        run: tclsh tests/tcl/review_ui.tcl

      # The progress pane (#422 item 3): the feed, the header for every source,
      # the bar's fraction from ::reviewui::passFraction, and the docking arm
      # that makes the surface a pane of the app rather than a window of its own.
      - name: Review progress pane
        run: tclsh tests/tcl/review_progress_pane.tcl

      # The notices this repository claims are the notices it keeps (#422).
      - name: Licensing
        run: tclsh tests/tcl/licensing.tcl

      - name: Engine preset duplicate
        run: tclsh tests/tcl/engine_duplicate.tcl

      - name: Help keys
        run: tclsh tests/tcl/help_keys.tcl

      - name: Engine seed
        run: tclsh tests/tcl/engine_seed.tcl

      - name: Provider layer
        run: tclsh tests/tcl/auto_comment_provider.tcl

      - name: Options file save
        run: tclsh tests/tcl/options_write.tcl

      # The downloader's failure and cancel paths: a failed curl/wget must not
      # install a truncated file, and cancel must kill the child, not wait on it.
      - name: Update download
        run: tclsh tests/tcl/updatecheck_download.tcl

  tk-dialogs:
    name: dialogs under Tk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # These build real widgets, so they need Tk and a display. Xvfb
      # supplies the display; nothing is drawn anywhere the user can see.
      - name: Install Tcl, Tk and Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tcl tk xvfb

      - name: Auto Comment dialogs
        run: xvfb-run -a wish tests/tcl/auto_comment_dialogs.tcl

      # The Review Settings dialog: the tclsh harnesses decide what it stores,
      # but only building it shows that the proc holding the widgets compiles
      # and that the OK button is there to press.
      - name: Review Settings dialog
        run: xvfb-run -a wish tests/tcl/review_settings_dialog.tcl

      # The Comment Window's own colour: the Format menu's entry, the saved
      # ::pgnColor(Comment), and the editor following it.
      - name: Comment default colour
        run: xvfb-run -a wish tests/tcl/comment_default_color_tk.tcl

      - name: Finish Game dialog
        run: xvfb-run -a wish tests/tcl/finish_game_dialog.tcl

      # The progress pane's widgets (#422 item 3): built through the real
      # docking layer, an explicit psize, no bindings, and a hidden tab that
      # draws the current position when it comes back.
      - name: Review progress pane
        run: xvfb-run -a wish tests/tcl/review_progress_pane_tk.tcl

  startup-smoke:
    name: startup with a clean profile
    runs-on: ubuntu-latest
    # apt on a hosted runner occasionally stalls on a mirror; a stuck install
    # should fail here rather than sit until the six-hour job limit.
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The app itself, not a harness: a clean profile has no options.dat, so
      # the built-in layout is restored and it docks .engineWin1. v5.1.4.50
      # sourced end.tcl before the modules that window calls, and every such
      # start died before the event loop. Nothing Tcl-level can see that; only
      # booting the binary can.
      # cmake, make and g++ are in the runner image; only the Tcl/Tk headers
      # and Xvfb are missing.
      - name: Install Tk headers and Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tcl8.6-dev tk8.6-dev xvfb

      - name: Build and install
        # A release build always sets this (release.yml does). Without it the
        # shallow checkout has no tags, so CMake's `git describe` stamps the
        # commit hash, and start.tcl's "5.1" version check cannot parse it.
        env:
          SCIDCOMMUNITY_VERSION: 5.1.4.0
        run: |
          cmake -S . -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j"$(nproc)"
          DESTDIR="$PWD/AppDir" cmake --install build

      - name: Start with a clean profile
        env:
          STARTUP_SMOKE_SECONDS: 10
        run: xvfb-run -a tests/startup_smoke.sh "$PWD/AppDir/usr/bin/scidCommunity"

      # The built binary's own sc_game info: the Game Info panel must show
      # comment text, not the comment editor's colour markup.
      - name: Game Info comment markup
        run: xvfb-run -a "$PWD/AppDir/usr/bin/scidCommunity" tests/tcl/game_info_comment.tcl
